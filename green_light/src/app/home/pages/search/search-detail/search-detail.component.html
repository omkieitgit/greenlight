<div class="p-b-20 parent-loader w-100 " *ngIf="searchResult">
    <!-- Loader DIV -->
    <div *ngIf="!loading"  class="child-loader"><span class="spinner-small "></span></div>
    <!-- Loader DIV -->
    <!-- begin tabs -->
    <ngb-tabset class="nav-tabs-inverse nav-justified nav-justified-mobile green_search ">
        <ngb-tab>
            <ng-template ngbTabTitle>
                <span class="d-none d-md-inline">SEARCH RESULT</span>
            </ng-template>
            <ng-template ngbTabContent>
                <app-search-result [searchResult]="searchResult" [loading]="loading" [totalRecord]="totalRecord" [searchField]="searchField" [limit]="limit"></app-search-result>
            </ng-template>
        </ngb-tab>
        <ngb-tab>
            <ng-template ngbTabTitle>
                <span class="d-none d-md-inline">MAP</span>
            </ng-template>
            <ng-template ngbTabContent>
                <div class="estate_content">
                    <div class="row">
                        <div class="col-lg-12">
                            <app-here-map *ngIf="map_data" lat="37.579412513438385" lng="-88" width="100%" height="500px" zoom="5" [search_info]="map_data"></app-here-map>
                        </div>
                    </div>
                </div>
            </ng-template>
        </ngb-tab>
    </ngb-tabset>
    <!-- end tabs -->
</div>
