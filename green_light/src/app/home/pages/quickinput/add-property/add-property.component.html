<panel [collapse]='false' title="Property Details (Building, Land, Location, Assessment)">

  <!-- Loder & Messages -->
  <form [formGroup]="propertyForm" [appDisableElement]="propertyForm" class="parent-loader">
    <!-- Loader DIV -->
    <app-loader [loading]="loading"></app-loader>
    <!-- Loader DIV -->

    <!-- <div class="alert alert-dark fade show m-b-5 m-t-5 text-black">Property Description</div> -->
    <fieldset>
      <div class="form-group row m-b-5">
          <div class="col-md-2">
            <div class="form-group _navbar_search">
              <label class="col-form-label">Property Address</label>  
              <mat-form-field appearance="outline">
                <input type="text" class="form-control" matInput  formControlName="address" [matAutocomplete]="auto" class="text-color">
                <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="searchProperty()">
                  <mat-option *ngFor="let option of filteredOptions" [value]="option">
                    {{option.address}}
                  </mat-option>
                  <mat-option *ngIf="loading">
                    <mat-spinner diameter="30" value="100"></mat-spinner>
                  </mat-option>
                  <mat-option *ngIf="noResult">
                    No Result Found
                  </mat-option>
                </mat-autocomplete>
                <mat-icon  matSuffix color="primary" class="search-property md-18">
                  <i class="fa fa-search"></i>
                </mat-icon>
              </mat-form-field>
            </div>
          </div>
        <!-- <div class="col-md-2">
          <label class="col-form-label">Property Address</label>
          <input type="text" formControlName="address" [ngClass]="{ 'is-invalid': submitted && f.address.errors }" class="form-control m-b-0 my-class"  />
          <div *ngIf="f.address.errors" class="invalid-feedback">
            <div *ngIf="f.address.errors.required">Property address is required</div>
          </div>
                
        </div> -->
        <div class="col-md-2">
          <label class="col-form-label">City</label>
          <input type="text" formControlName="city" [ngClass]="{ 'is-invalid': submitted && f.city.errors }" class="form-control m-b-0"  />
          <div *ngIf="f.city.errors" class="invalid-feedback">
            <div *ngIf="f.city.errors.required">City is required</div>
          </div>           
        </div>
        <div class="col-md-2">
          <label class="col-form-label">State</label>
          <select class="form-control" formControlName="state" (change)="getCountyList($event.target.value)"  [ngClass]="{ 'is-invalid': submitted && f.state.errors }">
            <option value="">Select State</option>
            <option [value]="state.key" *ngFor="let state of states | keyvalue">{{state.value}}</option>
          </select>
          <div *ngIf="f.state.errors" class="invalid-feedback">
            <div *ngIf="f.state.errors.required">State is required</div>
          </div>  
        </div>
        <div class="col-md-2">
          <label class="col-form-label">County</label>
          <select class="form-control" formControlName="county" [ngClass]="{ 'is-invalid': submitted && f.county.errors }" >
            <option value="">Select County</option>
            <option [value]="country" *ngFor="let country of countries">{{country}}</option>
          </select>
            <div *ngIf="f.county.errors" class="invalid-feedback">
              <div *ngIf="f.county.errors.required">County is required</div>
            </div>
        </div>
        <div class="col-md-2">
          <label class="col-form-label">Zip</label>
          <input type="text" formControlName="zip" class="form-control m-b-0"  [ngClass]="{ 'is-invalid': submitted && f.zip.errors }"/>
          <div *ngIf="f.zip.errors" class="invalid-feedback">
            <div *ngIf="f.zip.errors.required">Zip is required</div>
          </div>  
        </div>
        <div class="col-md-2">
          <label class="col-form-label">Parcel ID 1</label>
          <input type="text" formControlName="parcel_id1" [ngClass]="{ 'is-invalid': submitted && f.parcel_id1.errors }" class="form-control m-b-0"/>        
          <div *ngIf="f.parcel_id1.errors" class="invalid-feedback">
            <div *ngIf="f.parcel_id1.errors.required">Parcel ID 1 is required</div>
          </div>
        </div>
      </div>
      <div class="form-group row m-b-5">
        <div class="col-md-10">
          <ng-container *ngIf="propertyUrl" >
            <a  href="javascript:;"  target="_blank" [routerLink]="[propertyUrl]" >
              Property Detail
            </a>
          </ng-container>
        </div>
        <div class="col-md-2">
          <button type="button" *hideElement="true" (click)="validateForm(this.propertyForm)" class="form-control m-b-0 btn btn-sm btn-primary" value="Save"  >Save
            <i *ngIf="loading" class="fa fa-spin fa-spinner"></i>
          </button>
        </div>
      </div>

      <!-- one row end -->
    </fieldset>
  </form>
</panel>
