<app-attention-warning></app-attention-warning>
<div class="row">
    <!-- begin col-6 -->
      <div class="col-lg-12">
        <!-- end nav-pills -->
        <ngb-tabset type="pills">
            <ngb-tab>
              <ng-template ngbTabTitle>
                <span class="d-sm-none"><strong>PROPERTY DETAILS</strong></span>
                <span class="d-sm-block d-none"><strong>PROPERTY DETAILS</strong></span>
              </ng-template>
              <ng-template ngbTabContent class="estate_content parent-loader">
                  <app-loader [loading]="loading"></app-loader>

                  <app-add-property *ngIf="!loading" [infoData]="infoData"></app-add-property> 
                  <sale></sale>
              </ng-template>
            </ngb-tab>
            
        </ngb-tabset>
      </div>
</div>
