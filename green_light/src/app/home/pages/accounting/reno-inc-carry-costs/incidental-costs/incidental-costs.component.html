<div  class="parent-loader">

  <!-- Loader DIV -->
  <div *ngIf="loading"  class="child-loader"><span class="spinner-small "></span></div>
  <!-- Loader DIV -->
  <form>
    <fieldset>
      <legend>Incidental Costs</legend>
      <div class="form-group row">
          <div class="col-md-12">
            <div class="table-responsive table-fixed-header">
              <table class="table table-bordered table-condensed">
                  <thead>
                    <tr>
                      <th>Transaction Date</th>
                      <th>Description</th>
                      <th>Amount</th>
                      <th>Link</th>
                      <th>Category</th>
                    </tr>
                  </thead>
                <tbody>
                  <ng-container *ngIf="incidentalInfo.length>0">
                    <tr *ngFor="let incidental of incidentalInfo">
                      <td>{{incidental.invoice_date | date:'MM/dd/YYYY' }}</td>
                      <td>{{incidental.description}}</td>
                      <td>{{incidental.amount | currency }}</td>
                      <td class="break"><a *ngIf="incidental?.invoice_url && isValidURL(incidental?.invoice_url)" href="{{incidental?.invoice_url}}" target="_blank" [title]="incidental?.invoice_url">View</a></td>
                      <td>{{incidental?.category?.category_name}}</td>
                    </tr>
                  </ng-container>
                  <ng-container *ngIf="incidentalInfo.length==0">
                    <tr>
                      <td colspan="6" class="text-center font-weight-bold">No Record Found </td>
                    </tr>
                  </ng-container>
                </tbody>
                <tfoot *ngIf="incidentalInfo.length>0">
                    <th colspan="2" class="text-right">Total</th>
                    <th>{{ totalAmount | currency }}</th>
                    <th colspan="2"></th>
                </tfoot>
              </table>
            </div>
          </div>
      </div>
    </fieldset>
  </form>
  
</div>
