<!-- one row start-->
<fieldset>
  <div class="form-group row">
    <div class="col-md-12">
        <fieldset>
        <legend>RENO & HOLDING COST</legend>     
        <app-loader [loading]="loading"></app-loader>  
        <div *ngIf="nonHubResult" class="table-responsive table-fixed-header">
          <table class="table table-bordered table-condensed">
              <thead>
                <tr>
                  <th>Sub Category</th>
                  <th>Amount</th>
                </tr>
              </thead>
            <tbody>
              <tr *ngFor="let nonHub of nonHubResult">
                <td>{{nonHub?.category?.category_name}}</td>
                <td>{{nonHub.total_amount | currency}}</td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td align="right" ><strong>Total Reno and Holding Costs:</strong></td>
                <td>{{ (nonHubResult|sum:'total_amount') | currency }}</td>
              </tr>
              </tfoot>
          </table>
        </div>  
      </fieldset>
    </div>
  </div>
</fieldset>


<!-- one row end -->
