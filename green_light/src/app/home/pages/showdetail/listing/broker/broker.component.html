<div class="form-group row m-b-5">
        <div class="col-md-2">
                <label class="col-form-label">Broker Name</label>
                <input type="text" formControlName="broker_name" class="form-control m-b-0"  />            
        </div>
        <div class="col-md-2">
                <label class="col-form-label">Broker phone</label>
                <input type="text" formControlName="broker_phone" class="form-control m-b-0"  />            
        </div>


        <div class="col-md-2">
                <label class="col-form-label">Broker E-mail </label>
                <input type="text" formControlName="broker_email" class="form-control m-b-0"  />            
        </div>

        <div class="col-md-2">
                <label class="col-form-label">Broker License # </label>
                <input type="text" formControlName="broker_license #" class="form-control m-b-0"  />            
        </div>

        <div class="col-md-2">
                <label class="col-form-label">Broker Address # </label>
                <input type="text" formControlName="broker_address #" class="form-control m-b-0"  />            
        </div>
        
</div> 
<!-- one row start-->
<div class="form-group row">
        <div class="col-md-11"></div>
        <div class="col-md-1 pull-right text-right">
                <button type="button" class="m-t-5 btn btn-sm btn-primary" (click)="addMoreBtn()" >
                        Add More
                </button>
        </div>
</div>
