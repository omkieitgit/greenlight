
<div class="estate-property" >
  <div class="col-lg-12 p-0">
      <div class="form-group row m-b-20 m-t-5">
          <div class="col-md-12">
          </div>
          <div class="col-md-12">
            <app-common-notes [note_name]="buyer_notes"></app-common-notes>
          </div>
      </div>
      <!-- <div class="form-group row m-b-20 m-t-5">
        <div class="col-md-12">
          <app-common-notes [note_name]="manager_notes"></app-common-notes>
        </div>
      </div> -->
    <!-- begin panel -->
    
      <panel [collapse]='false' (valueChange)='panelExpand($event)' title="Property Details (Building, Land, Location, Assessment)  &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; {{ 'Total Living SF: '+infoData?.total_living_sqft +' &nbsp;&nbsp;'+ 'Year Built: '+infoData?.year_built +'  &nbsp;&nbsp;'+ 'Bed: '+infoData?.bed +' &nbsp;&nbsp;'+ 'Lot Acres SF: '+infoData?.lot_acreage_sf}}">
          <prop-info *ngIf="infoData" [infoData]="infoData" [isFavourite]="isFavourite"></prop-info>
          <real-state *ngIf="realStateData" [realStateData]="realStateData"></real-state>
          <price-history  *ngIf="priceHistoryData" [priceHistoryData]="priceHistoryData"></price-history>
          <school *ngIf="schoolData" [schoolData]="schoolData"></school>
          <assessment *ngIf="assessmentData" [assessmentData]="assessmentData" > </assessment>
      </panel>
      <div #infoSections></div>
    <!-- end panel -->
  </div>
  <!-- end col-12 -->
</div>
<!-- row end -->
