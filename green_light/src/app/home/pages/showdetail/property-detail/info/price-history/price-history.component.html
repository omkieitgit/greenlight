<!-- Loder & Messages -->
  <div class="alerts text-center">
    <div *ngIf="loadingMessage" class="alert">
      <p>Loading...</p>
    </div>
    <div *ngIf="propErr" class="alert">
      {{ propErrMsg }}
   </div>
  </div>
<!-- Loder & Messages -->
<form [formGroup]="priceHistoryForm" [appDisableElement]="priceHistoryForm" *ngIf="!propErr" class="_property_info ">
  

 <fieldset>
        <legend>Price History</legend>
        <!-- one row start-->
        <div formArrayName="price_info_data">
        <div  [formGroupName]="i"  *ngFor="let priceObj of priceHistoryForm.get('price_info_data')['controls']; let i = index;">
          <div id="{{i}}" class="form-group row m-b-1 parent-loader">
             <!-- Loader DIV -->
             <app-loader *ngIf="currentIndex==i" [loading]="loading"></app-loader>
            <!-- Loader DIV -->
            <input type="hidden" formControlName="id">
            <div class="col-md-2">
              <label class="col-form-label">Date</label>
              <my-date-picker [options]="myDatePickerOptions"  formControlName="price_date" [ngClass]="{'is-invalid': submitted && priceObj.controls.price_date.errors }" (dateChanged)="onDateChanged($event,dateInput)" #dateInput class="" placeholder="MM/DD/YYYY"></my-date-picker>
              
              <div *ngIf="priceObj.controls.price_date.errors && i==validRow" class="invalid-feedback" style="display:block;">
                  <div *ngIf="priceObj.controls.price_date.errors.required">Price Date is required</div>
              </div>
            </div>
            <div class="col-md-2">
              <label class="col-form-label">Price</label>
              <input type="text" formControlName="price" [ngClass]="{ 'is-invalid': submitted && priceObj.controls.price.errors && i==validRow }" class="form-control m-b-0" (change)="costPerSqft($event,i)"  appOnBlurSave (updatedValue)="autoSave($event)"/>         
              <div *ngIf="priceObj.controls.price.errors && i==validRow" class="invalid-feedback">
                  <div *ngIf="priceObj.controls.price.errors.required">Price is required</div>
              </div>
            </div>
            <div class="col-md-2">
              <label class="col-form-label">Cost per Sqft</label>
              <input type="text" formControlName="cost_per_sqft"  class="form-control m-b-0" appOnBlurSave (updatedValue)="autoSave($event)" />
            </div>
            <div class="col-md-2">
              <label class="col-form-label">Source</label>
              <input type="text" formControlName="source" class="form-control m-b-0"  appOnBlurSave (updatedValue)="autoSave($event)" />
            </div>
            <div class="col-md-2">
              <label class="col-form-label">Description</label>
              <select formControlName="description" class="form-control m-b-0" (change)="onDescChange($event.target.value, i)" appOnBlurSave (updatedValue)="autoSave($event)" >
                <option value="">Select Description</option>
                <option [value]="phdesc.key" *ngFor="let phdesc of price_desc | keyvalue">{{phdesc.value}}</option>
              </select>
            </div>  
            
            <div *hideElement="true" class="col-md-1 ">
                <div class="col-form-label  flt-l ">&nbsp;</div>
                <div class="clr-bth">
                  <button type="button" class="btn btn-sm btn-primary" (click)="validatePriceForm(priceObj,i)" value="Save" >
                    Save
                    <i *ngIf="loadingRow && currentIndex==i" class="fa fa-spin fa-spinner"></i>
                    <i *ngIf="!loadingRow" class="fa fa-save"></i>
                  </button>
                </div>
            </div>
            <div *hideElement="true" class="col-md-1 ">
                <div class="col-form-label  flt-l">&nbsp;</div>
                <div class="clr-bth">
                  <button *ngIf="priceHistoryForm.controls.price_info_data.length > 1" type="button"  
                    class="btn btn-sm btn-danger"
                    (click)="removePriceInputField(i,priceObj.get('id').value)" value="" >Remove
                    <i class="fa fa-trash"></i>
                  </button>
                </div>
            </div>

            
                              
          </div>
        </div>
    </div>
        <!-- one row end -->
        <!-- one row start-->
        <div class="form-group row">
            <div class="col-md-11"></div>
            <div class="col-md-1 pull-right text-right">
                <input type="button" formControlName="add_more" class="m-t-5 btn btn-sm btn-primary" (click)="addPriceInputField()" value="Add More" />
            </div>
        </div>
        <!-- one row end -->
  </fieldset>
</form>
