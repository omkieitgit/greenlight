<div class="estate-property">
    <!-- begin col-6 -->
    <div class="col-lg-12 p-0 parent-loader">
        <app-loader [loading]="loading"></app-loader>
        <!-- begin panel -->
        <div class="owner_buyer_wrapper">            
            <fieldset>
                <legend>Owner Info</legend>
                <form [formGroup]="ownerInfoForm" [appDisableElement]="ownerInfoForm" > 
                    <div class="form-group row">
                        <div class="col-md-6">
                            <div class="checkbox checkbox-css">
                                <input type="checkbox" id="propertyAddress" formControlName="is_owner_same_property_address" value="1" (change)="propertyAddressChk($event)" >
                                <label for="propertyAddress">Check if the Owner Information is same as Property Information.</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            
                            <div class="checkbox checkbox-css">
                                <input type="checkbox" id="noPacerResult" formControlName="no_pacer_result" value="1" (change)="noPacerResult($event)" >
                                <label for="noPacerResult">No Pacer Result</label>
                            </div>
                        </div>
                    </div>               
                    <!-- <div class="alert alert-dark fade show m-b-5 m-t-5 semi-bold text-black">Owner Info</div> -->
                    <div formArrayName="owner_info_data">
                        <div [appDisableElement]="owner" [formGroupName]="i"  *ngFor="let owner of ownerInfoForm.get('owner_info_data')['controls']; let i = index;">
                            <div id="{{i}}" class="form-group row">
                                <div class="col-md-2">
                                    <input type="hidden" formControlName="id"   />
                                    <label class="col-form-label">Owner Full Name </label>
                                    <input type="text" formControlName="full_name" placeholder="FirstName, MN, LastName" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.full_name.errors  && i==validRow}" class="form-control"   appOnBlurSave (updatedValue)="autoSave($event)" />
                                    <!-- [ngModel]="this.ownerData.Owner && this.ownerData.Owner[i]?.full_name"  -->
                                    <div *ngIf="owner.controls.full_name.errors && i==validRow" class="invalid-feedback">
                                        <div *ngIf="owner.controls.full_name.errors.required">Owner Full Name is required</div>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                        <label class="col-form-label">Owner Full Address</label>
                                        <input type="text" formControlName="full_address" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.full_address.errors  && i==validRow}"  class="form-control"    appOnBlurSave (updatedValue)="autoSave($event)" />
                                        <div *ngIf="owner.controls.full_address.errors" class="invalid-feedback">
                                            <div *ngIf="owner.controls.full_address.errors.required">Owner Full Address is required</div>
                                        </div>
                                </div>
                                <div class="col-md-2">
                                    <label class="col-form-label">Owner Email</label>
                                    <input type="text" formControlName="email" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.email.errors && i==validRow }" class="form-control"    appOnBlurSave (updatedValue)="autoSave($event)" />
                                    <div *ngIf="owner.controls.email.errors && i==validRow" class="invalid-feedback">
                                        <div *ngIf="owner.controls.email.errors.required">Owner Email is required</div>
                                        <div *ngIf="owner.controls.email.errors.email">Email is invalid</div>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <label class="col-form-label">Owner Phone 1</label>
                                    <input type="text" formControlName="phone" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.phone.errors  && i==validRow}" class="form-control"    appOnBlurSave (updatedValue)="autoSave($event)" />
                                    <div *ngIf="owner.controls.phone.errors && i==validRow" class="invalid-feedback">
                                        <div *ngIf="owner.controls.phone.errors.required">Owner Phone 1 is required</div>
                                    </div>
                                </div>
                                <!-- <div class="col-md-2">
                                    <label class="col-form-label">Deed BP/Instrument #</label>
                                    <input type="text" formControlName="deed_bp_instrument" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.deed_bp_instrument.errors && i==validRow }" class="form-control"   />
                                    <div *ngIf="owner.controls.deed_bp_instrument.errors && i==validRow" class="invalid-feedback">
                                        <div *ngIf="owner.controls.deed_bp_instrument.errors.required">Deed BP/Instrument # is required</div>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <label class="col-form-label">Deed Recorded Date</label>
                                    <my-date-picker name="deed_recorded_date" [options]="myDatePickerOptions" formControlName="deed_recorded_date" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.deed_recorded_date.errors && i==validRow }" (dateChanged)="onDateChanged($event)" placeholder="YYYY-MM-DD"></my-date-picker>
                                    <div *ngIf="owner.controls.deed_recorded_date.errors && i==validRow" class="invalid-feedback">
                                        <div *ngIf="owner.controls.deed_recorded_date.errors.required">Deed Recorded Date is required</div>
                                    </div>
                                </div> -->
                                <ng-container *ngIf="!no_pacer_result">
                                    <div class="col-md-2">
                                        <label class="col-form-label">Pacer URL</label>
                                        <span [appLink]="pacerUrl"></span>
                                        <input type="text" formControlName="pacer_url" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.pacer_url.errors && i==validRow }" class="form-control"    appOnBlurSave (updatedValue)="autoSave($event)" />
                                        <div *ngIf="owner.controls.pacer_url.errors && i==validRow" class="invalid-feedback">
                                            <div *ngIf="owner.controls.pacer_url.errors.required">Pacer URL is required</div>
                                        </div>
                                    </div>

                                    <div class="col-md-2">
                                        <label class="col-form-label">Beenverified URL</label>
                                        <span [appLink]="beenVerifiedUrl"></span>
                                        <input type="text" formControlName="beenverified_url" [ngClass]="{ 'is-invalid': submittedOwner && owner.controls.beenverified_url.errors && i==validRow }" class="form-control"    appOnBlurSave (updatedValue)="autoSave($event)" />
                                        <div *ngIf="owner.controls.beenverified_url.errors && i==validRow" class="invalid-feedback">
                                            <div *ngIf="owner.controls.beenverified_url.errors.required">Beenverified URL is required</div>
                                        </div>
                                    </div>
                                </ng-container>
                            </div>
                            <div class="form-group row">
                                

                                <div [ngClass]="{'col-md-9':ownerInfoForm.get('owner_info_data')['controls'].length ==(i+1), 'col-md-10':ownerInfoForm.get('owner_info_data')['controls'].length !=(i+1) }"></div>
                              
                                <div class="col-md-1 " *hideElement="true">
                                        <button  class=" form-control btn btn-sm btn-primary"  (click)="validateOwnerForm(owner,i)" >
                                            Save <i class="fa fa-save"></i>
                                        </button>
                                </div>
    
                                <div class="col-md-1 " *hideElement="true">
                                    <button *ngIf="ownerInfoForm.controls.owner_info_data.length > 1" class="form-control btn btn-sm btn-danger" (click)="removeOwnerInputField(i, owner.controls.id.value)">
                                        Remove <i class="fa fa-trash"></i>
                                    </button>
                                </div>
                                <ng-container *ngIf="ownerInfoForm.get('owner_info_data')['controls'].length ==(i+1)">
                                    <div *hideElement="true"  class="col-md-1 ">
                                        <button class="form-control btn btn-sm btn-primary" (click)="addOwnerInputField()" >Add More</button>
                                    </div>
                                </ng-container>
                            </div>
                        </div>
                    </div>

                    <!-- [disabled]="!form.valid" -->
                    <!-- one row start-->
                    
                    <app-common-notes [note_name]="owner_notes"></app-common-notes>
                    
                  
                                    
                </form>
            </fieldset>
            <!-- one row end -->
            <!-- ------ OWNER FORM EDNS AND BORROWER FORM STARTS ------->           
        </div><!-- Owner-Buyer-Wrapper End -->
        <!-- end panel -->
    </div>
    <!-- end col-12 -->
</div>
<!-- row end -->
