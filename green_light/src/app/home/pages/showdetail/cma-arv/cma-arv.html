<div *ngIf="loadCmaArv" class="estate-property col-lg-12 p-0">
  <!-- begin panel -->
    <div class="row m-b-5 justify-content-end" >
        <div class="col-md-1">
          <button class="form-control m-b-0 btn btn-sm btn-primary" 
                  [useExistingCss]="true" 
                  printTitle="Property Detail - {{ propertyInfo?.address }}" 
                  printSectionId="print-section" 
                  ngxPrint >
                  Print
          </button>
        </div>
    </div>
    <div  id="print-section">
      <app-cma-arv-detail [property_id]="property_id"></app-cma-arv-detail>
      <am-email *hideElement="true" [property_id]="property_id"></am-email>
      <!-- <app-wholesale-buyer *hideElement="true"></app-wholesale-buyer> -->
      <div class="col-lg-12 p-5">
          <div #cmaArvSections></div>
      </div>
    <!-- end panel -->
    </div>
</div>
