<div class="parent-loader">
  <div *ngIf="loadingContent"  class="child-loader">
      <span class="spinner-small "></span>
  </div>
  <div *ngIf="loadingContent" class="empty_box">
    
  </div>
  <ng-container>
    <div  *ngFor="let property of propertyInfo">
      <div class="col-lg-12 search_property_info hb_property_list" >
          <app-property-detail [property]="property.house" (valueChange)='displayCounter($event)' (removeValueChange)='removeHouseIds($event)'></app-property-detail>
          <div class="pull-right" style="margin-top: -35px;position: relative;">
              <button [routerLink]="['/home/quick-view/'+property.house_id+'/'+(property.address|slugify)]" class="m-r-5 btn btn-sm btn-primary" >Quick View Property Details</button>
          </div>
          <app-propety-amount [wholesale_buyer_n_total]="property.house.wholesale_buyer_n_total"></app-propety-amount>
      </div>
    </div>
    <div *ngIf="moreBtn" class="text-center m-t-20 m-b-10" >
        <button  class="btn btn-primary btn-sm" (click)="!loader && getloadmorepages()" >
          Load More
          <i *ngIf="loader" class="fa fa-spin fa-spinner"></i>
        </button>
    </div>
  </ng-container>
  
</div>
