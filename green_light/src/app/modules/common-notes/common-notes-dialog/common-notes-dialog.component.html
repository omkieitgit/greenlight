<h3 mat-dialog-title>{{note_name}} Notes</h3>
<mat-dialog-content>
  <form [formGroup]="notesForm">
    <div>
      <div class="form-group row m-b-0">
          <div class="col-md-12">
            <label class="col-form-label buyit-que-heading">Note:</label>
          </div>
      </div>
      <div class="form-group row m-b-0">
          <div class="col-md-12">
              <textarea autosize [minRows]="6" formControlName="notes" class="form-control m-r-5" [ngClass]="{'is-invalid': submitted && f.notes.errors }"></textarea>
              <div *ngIf="f.notes.errors" class="invalid-feedback">
                  <div *ngIf="f.notes.errors.required">Note is required</div>
              </div>
          </div>
          <input type="hidden" formControlName="note_type" />
          
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="validateForm(this.notesForm)">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
