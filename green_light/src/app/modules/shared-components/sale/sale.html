
<div class="estate-property">

  <!-- begin col-6 -->
  <div class="col-lg-12 p-0 _property_info">
  	<panel (valueChange)='panelExpand($event)' title="Sale Details or Foreclosure Info">
      <div class="parent-loader">
         <!-- Loader DIV -->
        <div *ngIf="loading"  class="child-loader"><span class="spinner-small "></span></div>
        <!-- Loader DIV -->
        <div class="row">
          <div class="col-lg-12 p-0"><div #salesParent></div></div>
        </div>
        <div class="row">
          <div class="col-md-10"></div>
          <div class="col-md-2 pull-right"><button class="form-control btn btn-sm btn-primary" (click)="more_sale_date();">Add More Sale Date</button></div>
        </div>
      </div>
    </panel>
  </div>
  <!-- end col-12 -->
</div>
<!-- row end -->
