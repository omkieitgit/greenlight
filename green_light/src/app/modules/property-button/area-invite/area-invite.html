<h3>Area Invite</h3>
<form [formGroup]="inviteForm" class="parent-loader">
  <div *ngIf="loading"  class="child-loader"><span class="spinner-small "></span></div>
  <div>
    <div class="form-group row m-b-0">
      <div class="col-md-6">
        <label class="col-form-label">Invite Type</label>
      </div>
    </div>
    <div class="form-group row m-b-0">
        <div class="col-md-6">
            <select class="form-control" formControlName="invite_type" (change)="getAreaInvite($event)" [ngClass]="{ 'is-invalid': submitted && f.invite_type.errors }">
              <option selected="selected">Select Invite Type</option>
              <option value="area_invite">Area Invite</option>
              <!-- <option value="county_invite">County Invite</option> -->
            </select> 
            <div *ngIf="f.invite_type.errors" class="invalid-feedback">
              <div *ngIf="f.invite_type.errors.required">Area invite is required</div>
            </div>
        </div>
    </div>

    <div class="form-group row m-b-0">
        <div class="col-md-6">
          <label class="col-form-label">Area List</label>
        </div>
      </div>
      <div class="form-group row m-b-0">
          <div class="col-md-12">
              <select class="form-control" formControlName="area_id" [ngClass]="{ 'is-invalid': submitted && f.area_id.errors }">
                <option *ngFor="let area of area_list" value="{{area.area_id}}">{{area.area_name}}</option>
              </select> 
              <div *ngIf="f.area_id.errors" class="invalid-feedback">
                <div *ngIf="f.area_id.errors.required">Area invite is required</div>
              </div>
          </div>
      </div>

    <div class="form-group row m-b-0">
        <div class="col-md-12">
          <label class="col-form-label">Notes</label>
        </div>
    </div>  
    <div class="form-group row m-b-0">        
        <div class="col-md-12">
            <textarea autosize [minRows]="5" formControlName="notes" [ngClass]="{ 'is-invalid': submitted && f.notes.errors }" class="form-control m-b-0"></textarea>
            <div *ngIf="f.notes.errors" class="invalid-feedback">
              <div *ngIf="f.notes.errors.required">Please enter note.</div>
            </div>
        </div>
    </div>
  </div>
  <mat-dialog-actions align="end">
      <button mat-button  mat-raised-button mat-dialog-close>Close</button>
      <button mat-button  mat-raised-button class="btn-primary" (click)="validateForm(this.inviteForm)">
        Invite
        <i *ngIf="loading" class="fa fa-spin fa-spinner"></i>
      </button>
  </mat-dialog-actions>
</form>
