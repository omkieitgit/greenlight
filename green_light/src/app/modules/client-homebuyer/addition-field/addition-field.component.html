<form [formGroup]="additionalFieldForm">
        <div class="form-group row m-b-5">         
                <div class="col-md-3">
                        <label class="col-form-label font-weight-normal">{{otherDetail.field_name}}</label>
                </div> 
                <div class="col-md-2">
                        <input type="text" [attr.disabled]="estAmountEditAccess? true : null" formControlName="est_amount"  class="form-control _est_amount" #estimate_amount (change)="diffCalculation(estimate_amount,actual_amount,diff_amount)" appOnBlurSave (updatedValue)="autoSave($event)"/>
                </div>
                <div class="col-md-2">
                        <input type="text" formControlName="actual_amount"  class="form-control _act_amount" #actual_amount />
                </div>
                <div class="col-md-2">
                        <input  type="text" formControlName="diff_amount" [ngClass]="{ 'text-success': additionalFieldForm.get('diff_amount').value>0,'text-danger': 0>additionalFieldForm.get('diff_amount').value }"  class="form-control" #diff_amount />       
                </div>
                <div class="col-md-2">
                        <input  type="text" formControlName="buyer_amount"  class="form-control _calc_amount"  #buyer_amount (change)="calcamount($event,buyer_amount)" appOnBlurSave (updatedValue)="autoSave($event)"/>           
                </div>
                
        </div>
</form>
