<form [formGroup]="homebuyerPayoutForm">
        <div class="form-group row m-b-5">         
                <div class="col-md-3">
                        <label class="col-form-label " [ngClass]="{'font-weight-normal':!borderClass}">{{payoutdetail.name}}</label>
                        <input type="hidden" formControlName="key_name" />
                </div> 
                <ng-container *ngIf="payoutdetail.input!='date'; else dateFields">
                        <div class="col-md-2">
                                <input type="text" formControlName="est_amount" [ngClass]="borderClass"  class="form-control _est_amount" #estimate_amount (change)="diffCalculation(estimate_amount,actual_amount,diff_amount)" appOnBlurSave (updatedValue)="autoSave($event)"/>
                        </div>
                        <div class="col-md-2">
                                <input type="text" formControlName="actual_amount" [ngClass]="borderClass"  class="form-control _act_amount" #actual_amount />
                        </div>
                        <div class="col-md-2">
                                <input  type="text" formControlName="diff_amount" [ngClass]="{ 'text-success': homebuyerPayoutForm.get('diff_amount').value>0,'text-danger': 0>homebuyerPayoutForm.get('diff_amount').value, 'text-box-border':borderClass }"  class="form-control" #diff_amount />       
                        </div>
                        <div class="col-md-2">
                                <input  type="text" formControlName="buyer_amount" [ngClass]="borderClass"   class="form-control _calc_amount"  #buyer_amount (change)="calcamount($event,buyer_amount)" appOnBlurSave (updatedValue)="autoSave($event)"/>           
                        </div>
                </ng-container>
                
        </div>

        <ng-template #dateFields>
                <div class="col-md-2">
                        <my-date-picker  name="est_amount" [options]="myDatePickerOptions" formControlName="est_amount" (dateChanged)="onDateChanged($event,estDateInput)" #estDateInput class="" placeholder="MM/DD/YYYY"></my-date-picker>
                </div>
                <div class="col-md-2">
                        <input type="text" formControlName="actual_amount" [ngClass]="borderClass"  class="form-control _act_amount" #actual_amount />
                </div>
                <div class="col-md-2">
                        <input  type="text" formControlName="diff_amount" [ngClass]="{ 'text-success': homebuyerPayoutForm.get('diff_amount').value>0,'text-danger': 0>homebuyerPayoutForm.get('diff_amount').value, 'text-box-border':borderClass }"  class="form-control" #diff_amount />       
                </div>
                <div class="col-md-2">
                        <my-date-picker name="buyer_amount" [options]="myDatePickerOptions" formControlName="buyer_amount" (dateChanged)="onDateChanged($event,buyerDateInput)" #buyerDateInput class="" placeholder="MM/DD/YYYY"></my-date-picker>
                </div>

        </ng-template>
</form>
